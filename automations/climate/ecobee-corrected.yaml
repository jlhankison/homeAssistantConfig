# CORRECTED Climate Automations - Addresses all identified issues

# 1. HEAT MODE OPERATIONS (When controller is in heat mode)
- alias: "Sync Ecobee for Heat Mode"
  trigger:
    - platform: state
      entity_id: climate.2354_climate_controller
      attribute: hvac_mode
      to: "heat"
    - platform: state
      entity_id: climate.2354_climate_controller
      attribute: temperature
  condition:
    - condition: state
      entity_id: climate.2354_climate_controller
      attribute: hvac_mode
      state: "heat"
    - condition: state
      entity_id: binary_sensor.use_heat_pump
      state: "off"  # Use boiler when heat pumps not recommended
  action:
    - service: climate.set_hvac_mode
      target:
        entity_id: climate.2354_ecobee_thermostat
      data:
        hvac_mode: "heat"
    - service: climate.set_temperature
      target:
        entity_id: climate.2354_ecobee_thermostat
      data:
        temperature: "{{ state_attr('climate.2354_climate_controller', 'temperature') }}"
    - service: climate.set_hvac_mode
      target:
        entity_id: 
          - climate.2354_dining_room_heat_pump
          - climate.2354_kitchen_heat_pump
      data:
        hvac_mode: "off"
  mode: parallel

# 2. HEAT PUMP HEATING (When heat pumps are recommended for heating)
- alias: "Use Heat Pumps for Heating"
  trigger:
    - platform: state
      entity_id: climate.2354_climate_controller
      attribute: hvac_mode
      to: "heat"
    - platform: state
      entity_id: climate.2354_climate_controller
      attribute: temperature
    - platform: state
      entity_id: binary_sensor.use_heat_pump
      to: "on"
  condition:
    - condition: state
      entity_id: climate.2354_climate_controller
      attribute: hvac_mode
      state: "heat"
    - condition: state
      entity_id: binary_sensor.use_heat_pump
      state: "on"  # Use heat pumps when recommended
  action:
    - service: climate.set_hvac_mode
      target:
        entity_id:
          - climate.2354_dining_room_heat_pump
          - climate.2354_kitchen_heat_pump
      data:
        hvac_mode: "heat"
    - service: climate.set_temperature
      target:
        entity_id:
          - climate.2354_dining_room_heat_pump
          - climate.2354_kitchen_heat_pump
      data:
        temperature: "{{ state_attr('climate.2354_climate_controller', 'temperature') }}"
    - service: climate.set_hvac_mode
      target:
        entity_id: climate.2354_ecobee_thermostat
      data:
        hvac_mode: "heat"
    - service: climate.set_temperature
      target:
        entity_id: climate.2354_ecobee_thermostat
      data:
        temperature: 65  # Minimum safety temperature
  mode: parallel

