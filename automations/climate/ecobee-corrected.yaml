      entity_id: climate.2354_climate_controller
      attribute: hvac_mode
      state: "cool"
  action:
    - service: climate.set_hvac_mode
      target:
        entity_id:
          - climate.2354_dining_room_heat_pump
          - climate.2354_kitchen_heat_pump
      data:
        hvac_mode: "cool"
    - service: climate.set_temperature
      target:
        entity_id:
          - climate.2354_dining_room_heat_pump
          - climate.2354_kitchen_heat_pump
      data:
        temperature: "{{ state_attr('climate.2354_climate_controller', 'temperature') }}"
    - service: climate.set_hvac_mode
      target:
        entity_id: climate.2354_ecobee_thermostat
      data:
        hvac_mode: "heat"
    - service: climate.set_temperature
      target:
        entity_id: climate.2354_ecobee_thermostat
      data:
        temperature: 65  # Minimum safety temperature
  mode: parallel

# 4. SYSTEM OFF (When controller is off)
- alias: "Set Minimum Temperature When System Off"
  trigger:
    - platform: state
      entity_id: climate.2354_climate_controller
      attribute: hvac_mode
      to: "off"
  condition:
    - condition: state
      entity_id: climate.2354_climate_controller
      attribute: hvac_mode
      state: "off"
  action:
    - service: climate.set_hvac_mode
      target:
        entity_id:
          - climate.2354_dining_room_heat_pump
          - climate.2354_kitchen_heat_pump
      data:
        hvac_mode: "off"
    - service: climate.set_hvac_mode
      target:
        entity_id: climate.2354_ecobee_thermostat
      data:
        hvac_mode: "heat"
    - service: climate.set_temperature
      target:
        entity_id: climate.2354_ecobee_thermostat
      data:
        temperature: 65  # Minimum safety temperature
  mode: parallel

# 5. AUTOMATIC HEAT SOURCE SWITCHING (Based on outside temperature)
- alias: "Switch Heat Source Based on Outside Temperature"
  trigger:
    - platform: state
      entity_id: binary_sensor.use_heat_pump
    - platform: state
      entity_id: sensor.outside_temp
    - platform: state
      entity_id: input_number.use_hp_temp
  condition:
    - condition: state
      entity_id: climate.2354_climate_controller
      attribute: hvac_mode
      state: "heat"
  action:
    - choose:
        # When heat pumps become recommended
        - conditions:
            - condition: state
              entity_id: binary_sensor.use_heat_pump
              state: "on"
          sequence:
            - service: automation.trigger
              target:
                entity_id: automation.use_heat_pumps_for_heating
        # When boiler becomes recommended  
        - conditions:
            - condition: state
              entity_id: binary_sensor.use_heat_pump
              state: "off"
          sequence:
            - service: automation.trigger
              target:
                entity_id: automation.sync_ecobee_for_heat_mode
  mode: parallel

# 6. AUTOMATIC MODE SWITCHING (Heat vs Cool based on conditions)
- alias: "Auto Switch Heat/Cool Mode"
  trigger:
    - platform: state
      entity_id: sensor.2354_average_indoor_temperature
    - platform: state
      entity_id: climate.2354_climate_controller
      attribute: temperature
  condition:
    - condition: not
      conditions:
        - condition: state
          entity_id: climate.2354_climate_controller
          attribute: hvac_mode
          state: "off"
  action:
    - choose:
        # Switch to cooling when indoor temp is above target
        - conditions:
            - condition: template
              value_template: >
                {{ states('sensor.2354_average_indoor_temperature') | int > 
                   state_attr('climate.2354_climate_controller', 'temperature') | int }}
          sequence:
            - service: climate.set_hvac_mode
              target:
                entity_id: climate.2354_climate_controller
              data:
                hvac_mode: "cool"
        # Switch to heating when indoor temp is below target
        - conditions:
            - condition: template
              value_template: >
                {{ states('sensor.2354_average_indoor_temperature') | int < 
                   state_attr('climate.2354_climate_controller', 'temperature') | int }}
          sequence:
            - service: climate.set_hvac_mode
              target:
                entity_id: climate.2354_climate_controller
              data:
                hvac_mode: "heat"
  mode: parallel