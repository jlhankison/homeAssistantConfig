# Utility rates, heat-pump COP curve, and cost-per-BTU decision logic.
#
# Rates are derived from the most recent WE Energies bill (kWh + $ and
# therms + $). This captures generation + delivery + fixed charges + taxes
# — the actual effective per-unit cost — instead of a published tariff rate
# that ignores fees. Update the four last_bill_* input_numbers each month
# when the new bill arrives and the effective rate sensors update.
#
# Economic decision: for each BTU of heat delivered,
#   heat_pump_$/BTU = effective_electricity_rate / (3412 BTU/kWh × COP(outdoor_temp))
#   boiler_$/BTU    = effective_gas_rate / (100000 BTU/therm × (AFUE/100))
# Heat pump wins when its $/BTU is lower AND outdoor temp is above the safety
# floor (below which the Gree units can't deliver reliably regardless of cost).

input_number:
  last_bill_electricity_kwh:
    name: Last bill — electricity used (kWh)
    min: 1
    max: 5000
    step: 1
    unit_of_measurement: "kWh"
    icon: mdi:lightning-bolt-outline
    initial: 350

  last_bill_electricity_charges:
    name: Last bill — electric charges ($)
    min: 0
    max: 2000
    step: 0.01
    unit_of_measurement: "$"
    icon: mdi:cash
    initial: 89.32

  last_bill_gas_therms:
    name: Last bill — natural gas used (therms)
    min: 0
    max: 500
    step: 0.1
    unit_of_measurement: "therms"
    icon: mdi:fire
    initial: 115.9

  last_bill_gas_charges:
    name: Last bill — gas charges ($)
    min: 0
    max: 2000
    step: 0.01
    unit_of_measurement: "$"
    icon: mdi:cash
    initial: 94.99

  boiler_afue_percent:
    name: Boiler AFUE (%)
    min: 70
    max: 99
    step: 1
    unit_of_measurement: "%"
    icon: mdi:water-boiler
    initial: 90

  heat_pump_safety_floor_f:
    name: Heat pump safety floor (°F)
    min: -10
    max: 40
    step: 1
    unit_of_measurement: "°F"
    icon: mdi:snowflake-thermometer
    initial: 15

template:
  - sensor:
      # Effective electricity rate = last bill's electric charges / kWh used.
      # Includes fixed charges + delivery + taxes — the real marginal-ish cost.
      - name: Effective Electricity Rate
        unique_id: effective_electricity_rate
        unit_of_measurement: "$/kWh"
        state_class: measurement
        icon: mdi:lightning-bolt
        state: >
          {% set kwh = states('input_number.last_bill_electricity_kwh') | float(0) %}
          {% set charges = states('input_number.last_bill_electricity_charges') | float(0) %}
          {% if kwh > 0 %}
            {{ (charges / kwh) | round(4) }}
          {% else %}
            0.25
          {% endif %}

      # Effective natural gas rate = last bill's gas charges / therms used.
      - name: Effective Gas Rate
        unique_id: effective_gas_rate
        unit_of_measurement: "$/therm"
        state_class: measurement
        icon: mdi:fire
        state: >
          {% set therms = states('input_number.last_bill_gas_therms') | float(0) %}
          {% set charges = states('input_number.last_bill_gas_charges') | float(0) %}
          {% if therms > 0 %}
            {{ (charges / therms) | round(4) }}
          {% else %}
            1.00
          {% endif %}

      # Generic cold-climate mini-split COP curve. Piecewise linear between
      # (T=47°F, COP=3.8) and (T=-5°F, COP=1.0). Clamped outside the range.
      # Refine with actual Gree model datasheet when available.
      - name: Heat Pump COP
        unique_id: heat_pump_cop
        state_class: measurement
        icon: mdi:gauge
        state: >
          {% set T = states('sensor.outside_temperature') | float(32) %}
          {% if T >= 47 %}
            3.80
          {% elif T <= -5 %}
            1.00
          {% else %}
            {{ (1.0 + (T + 5) * 0.0538) | round(2) }}
          {% endif %}
        availability: >
          {{ states('sensor.outside_temperature') not in ['unknown', 'unavailable', 'none'] }}

      - name: Heat Pump Cost per BTU
        unique_id: heat_pump_usd_per_btu
        unit_of_measurement: "$/BTU"
        state_class: measurement
        icon: mdi:currency-usd
        state: >
          {% set rate = states('sensor.effective_electricity_rate') | float(0.25) %}
          {% set cop = states('sensor.heat_pump_cop') | float(1.0) %}
          {{ (rate / (3412 * cop)) | round(8) }}
        availability: >
          {{ states('sensor.heat_pump_cop') not in ['unknown', 'unavailable', 'none'] }}

      - name: Boiler Cost per BTU
        unique_id: boiler_usd_per_btu
        unit_of_measurement: "$/BTU"
        state_class: measurement
        icon: mdi:currency-usd
        state: >
          {% set rate = states('sensor.effective_gas_rate') | float(1.00) %}
          {% set afue = states('input_number.boiler_afue_percent') | float(90) %}
          {{ (rate / (100000 * (afue / 100))) | round(8) }}

      - name: Preferred Heat Source
        unique_id: preferred_heat_source
        icon: mdi:thermostat
        state: >
          {% set hp_cost = states('sensor.heat_pump_cost_per_btu') | float(999) %}
          {% set boiler_cost = states('sensor.boiler_cost_per_btu') | float(999) %}
          {% set outside = states('sensor.outside_temperature') | float(0) %}
          {% set floor = states('input_number.heat_pump_safety_floor_f') | float(15) %}
          {% if outside < floor %}
            boiler
          {% elif hp_cost < boiler_cost %}
            heat_pump
          {% else %}
            boiler
          {% endif %}
        attributes:
          reason: >
            {% set hp_cost = states('sensor.heat_pump_cost_per_btu') | float(999) %}
            {% set boiler_cost = states('sensor.boiler_cost_per_btu') | float(999) %}
            {% set outside = states('sensor.outside_temperature') | float(0) %}
            {% set floor = states('input_number.heat_pump_safety_floor_f') | float(15) %}
            {% set cop = states('sensor.heat_pump_cop') | float(1.0) %}
            {% set er = states('sensor.effective_electricity_rate') | float(0) %}
            {% set gr = states('sensor.effective_gas_rate') | float(0) %}
            {% if outside < floor %}
              Outside {{ outside }}°F below {{ floor }}°F safety floor — boiler only.
            {% elif hp_cost < boiler_cost %}
              HP at COP {{ cop }} (elec ${{ er }}/kWh) = ${{ hp_cost }}/BTU; boiler (gas ${{ gr }}/therm) = ${{ boiler_cost }}/BTU.
            {% else %}
              Boiler (gas ${{ gr }}/therm) = ${{ boiler_cost }}/BTU beats HP at COP {{ cop }} (elec ${{ er }}/kWh) = ${{ hp_cost }}/BTU.
            {% endif %}
          heat_pump_cost_per_btu: "{{ states('sensor.heat_pump_cost_per_btu') }}"
          boiler_cost_per_btu: "{{ states('sensor.boiler_cost_per_btu') }}"
          heat_pump_cop: "{{ states('sensor.heat_pump_cop') }}"
          outside_temperature: "{{ states('sensor.outside_temperature') }}"
          effective_electricity_rate: "{{ states('sensor.effective_electricity_rate') }}"
          effective_gas_rate: "{{ states('sensor.effective_gas_rate') }}"

  - binary_sensor:
      - name: Heat Pump Economical
        unique_id: heat_pump_economical
        device_class: heat
        icon: mdi:heat-pump
        state: >
          {{ states('sensor.preferred_heat_source') == 'heat_pump' }}
        attributes:
          reason: "{{ state_attr('sensor.preferred_heat_source', 'reason') }}"
