# Shared utility rates + heat-pump COP curve. Boiler AFUE and the resulting
# per-unit $/BTU and preferred-source decisions live in the per-unit packages
# (climate_main.yaml / climate_rental.yaml) because the two boilers are
# different equipment with different efficiencies:
#   main   — Burnham P-204A-WNI   (~80% AFUE, older cast iron)
#   rental — New Yorker CG30F     (84% AFUE, newer cast iron)
#
# Uses MARGINAL rates (variable per-unit charges only), not average bill rates.
# Fixed customer charges are paid whether you run the boiler zero hours or
# a thousand, so they don't affect the "should I use 1 more BTU from X or Y"
# decision. Economic decisions should use marginal costs.
#
# How to read marginal rates from a WE Energies bill:
#
#   Electric marginal ($/kWh) = Energy Charge rate
#                             + Energy for Tomorrow rate
#                             + Environmental Control Charge rate
#                             then × 1.03 for 3% State Low Income Assistance Fee
#
#   Gas marginal ($/therm)    = Distribution rate
#                             + Base Gas rate
#                             + average PGA (weighted by days-in-period)
#
# These change quarterly at most; update whenever you notice a bill with
# different per-kWh or per-therm numbers.
#
# Economic decision, for each BTU of heat delivered:
#   heat_pump_$/BTU  = electric_marginal / (3412 BTU/kWh × COP(outdoor_temp))
#   boiler_$/BTU     = gas_marginal / (100000 BTU/therm × (AFUE/100))
# Heat pump wins when its $/BTU is lower AND outdoor temp is above the safety
# floor (below which the Gree units can't deliver reliably regardless of cost).

input_number:
  marginal_electricity_rate:
    name: Electricity rate ($/kWh, marginal)
    min: 0.05
    max: 0.50
    step: 0.0001
    unit_of_measurement: "$/kWh"
    icon: mdi:lightning-bolt
    initial: 0.2117

  marginal_gas_rate:
    name: Natural gas rate ($/therm, marginal)
    min: 0.10
    max: 3.00
    step: 0.0001
    unit_of_measurement: "$/therm"
    icon: mdi:fire
    initial: 0.7342

  heat_pump_safety_floor_f:
    name: Heat pump safety floor (°F)
    min: -10
    max: 40
    step: 1
    unit_of_measurement: "°F"
    icon: mdi:snowflake-thermometer
    initial: 15

template:
  - sensor:
      # COP curve for Gree Multi21+ 2-zone system (main unit only):
      #   outdoor  MULTI24HP230V1CO (24k BTU, serves both kitchen + dining)
      #   indoor   2× 3VIR12HP230V1AH cassettes (12k each)
      # AHRI: 24,000 BTU/hr @ 47°F nominal, SEER2 21, HSPF2 9.0.
      # Multi-zone condensers run lower efficiency than 1:1 single-zone
      # systems because of inverter staging across heads.
      # Confirmed anchor: COP 1.81 @ -8°C (17.6°F), 16,600 BTU/hr output.
      # Other anchors interpolated from HSPF2 9.0 rating:
      #   47°F → 3.10   17°F → 1.81 (confirmed)   5°F → 1.50   -4°F → 1.30
      # Below -4°F the curve clamps. The input_number.heat_pump_safety_floor_f
      # (default 15°F) should kick the decision to boiler well before then.
      # Refine anchors if the Gree submittal PDF yields a full capacity table.
      - name: Heat Pump COP
        unique_id: heat_pump_cop
        state_class: measurement
        icon: mdi:gauge
        state: >
          {% set T = states('sensor.outside_temperature') | float(32) %}
          {% if T >= 47 %}
            3.10
          {% elif T >= 17 %}
            {{ (1.81 + (T - 17) * 0.043) | round(2) }}
          {% elif T >= 5 %}
            {{ (1.50 + (T - 5) * 0.026) | round(2) }}
          {% elif T >= -4 %}
            {{ (1.30 + (T + 4) * 0.022) | round(2) }}
          {% else %}
            1.30
          {% endif %}
        availability: >
          {{ states('sensor.outside_temperature') not in ['unknown', 'unavailable', 'none'] }}

      - name: Heat Pump Cost per BTU
        unique_id: heat_pump_usd_per_btu
        unit_of_measurement: "$/BTU"
        state_class: measurement
        icon: mdi:currency-usd
        state: >
          {% set rate = states('input_number.marginal_electricity_rate') | float(0.21) %}
          {% set cop = states('sensor.heat_pump_cop') | float(1.0) %}
          {{ (rate / (3412 * cop)) | round(8) }}
        availability: >
          {{ states('sensor.heat_pump_cop') not in ['unknown', 'unavailable', 'none'] }}
