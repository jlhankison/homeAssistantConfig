# ================================================================================================
# HOME ASSISTANT CONFIGURATION - Booth St. House
# ================================================================================================
# Modular climate control system with heat pump and boiler integration
# Last updated: $(date)
# ================================================================================================

# Core Home Assistant Configuration
homeassistant:
  name: Booth St. House
  latitude: !secret latitude
  longitude: !secret longitude
  elevation: 692
  unit_system: imperial
  time_zone: "America/Chicago"
  country: "US"
  currency: USD
  internal_url: "http://homeassistant.local:8123"
  
  # Package system for modular configuration
  packages: !include_dir_named packages/

# ================================================================================================
# CORE INTEGRATIONS
# ================================================================================================

# Load default integrations (required)
default_config:

# Text-to-Speech
tts:
  - platform: google_translate
    cache: true
    cache_dir: /tmp/tts
    time_memory: 300

# ================================================================================================
# USER INTERFACE
# ================================================================================================

lovelace:
  mode: yaml
  resources:
    - url: /local/config-template-card.js
      type: module
    - url: /local/state-switch.js
      type: module
    - url: /local/custom-lovelace/swipe-card/swipe-card.js
      type: module
    - url: /local/clock-weather-card.js
      type: module

# ================================================================================================
# CLIMATE SYSTEM CONFIGURATION
# ================================================================================================

# Climate Templates and Sensors
template: !include_dir_merge_list templates/

# Input Numbers for System Configuration
input_number:
  heat_pump_threshold_temp:
    name: "Heat Pump Threshold Temperature"
    min: 20
    max: 60
    step: 1
    unit_of_measurement: "°F"
    icon: mdi:thermometer
    initial: 35

# Climate Groups
group:
  heat_pumps_all:
    name: "All Heat Pumps"
    entities:
      - climate.dining_room_heat_pump
      - climate.kitchen_heat_pump

  climate_sensors_indoor:
    name: "Indoor Temperature Sensors"
    entities:
      - sensor.kitchen_temperature
      - sensor.dining_room_temperature  
      - sensor.living_room_temperature

# ================================================================================================
# MODULAR INCLUDES
# ================================================================================================

# Climate System
climate: !include climate/master_controller.yaml

# Automations (organized by domain)
automation: !include_dir_merge_list automations/

# Scripts
script: !include scripts.yaml

# Scenes  
scene: !include scenes.yaml

# ================================================================================================
# SYSTEM MONITORING & LOGGING
# ================================================================================================

logger:
  default: warning
  logs:
    homeassistant.components.climate: info
    homeassistant.components.automation: info
    
recorder:
  exclude:
    domains:
      - weblink
      - updater
    entities:
      - sun.sun
      - sensor.date
      - sensor.time

# ================================================================================================
# END CONFIGURATION
# ================================================================================================